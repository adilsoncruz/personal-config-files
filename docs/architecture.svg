<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="green-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Filters -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 22px; font-weight: 700; fill: #f3f4f6; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 400; fill: #9ca3af; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #f9fafb; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94a3b8; }
    .badge-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 10px; font-weight: 600; }
    .conn-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 500; fill: #64748b; }
  </style>

  <!-- Canvas Background -->
  <rect width="1100" height="620" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(40, 42)">
    <text class="title">Agentic OS — Architecture &amp; Execution Topology</text>
    <text class="subtitle" y="24">Multi-engine semantic routing, isolated Linux sandboxing, and persistent structural memory</text>
  </g>

  <!-- Connection Lines (SVG Paths) -->
  <g stroke="#334155" stroke-width="1.5" fill="none">
    <!-- Input to Router -->
    <path d="M 230 180 L 320 180" stroke="#38bdf8" stroke-dasharray="4,4" />
    
    <!-- Router to Models -->
    <path d="M 520 180 C 560 180, 560 120, 600 120" stroke="#4ade80" />
    <path d="M 520 180 C 560 180, 560 180, 600 180" stroke="#38bdf8" />
    <path d="M 520 180 C 560 180, 560 240, 600 240" stroke="#c084fc" />
    <path d="M 520 180 C 560 180, 560 300, 600 300" stroke="#fbbf24" />
    <path d="M 520 180 C 560 180, 560 360, 600 360" stroke="#64748b" />

    <!-- Models to Execution / Storage -->
    <path d="M 850 180 C 900 180, 900 480, 850 480" stroke="#38bdf8" stroke-dasharray="3,3" />
    
    <!-- Router to Graph / Memory -->
    <path d="M 420 235 L 420 440" stroke="#94a3b8" stroke-dasharray="4,4" />
    <path d="M 420 440 L 260 490" stroke="#94a3b8" />
    <path d="M 420 440 L 570 490" stroke="#94a3b8" />
  </g>

  <!-- ==================== LAYER 1: DEVELOPER INPUT ==================== -->
  <g transform="translate(40, 120)" filter="url(#drop-shadow)">
    <rect width="190" height="120" rx="12" fill="#131c2e" stroke="#1e3a8a" stroke-width="1.5" />
    <rect x="14" y="14" width="28" height="28" rx="6" fill="#1e293b" />
    <text x="21" y="33" font-size="16">💻</text>
    <text class="card-title" x="50" y="33">Developer &amp; Orca</text>
    <text class="card-desc" x="14" y="65">Git Worktree Isolation</text>
    <text class="card-desc" x="14" y="82">Terminal Prompt Loop</text>
    <rect x="14" y="94" width="84" height="16" rx="4" fill="#1e3a8a" />
    <text class="badge-text" x="20" y="106" fill="#60a5fa">HOST RUNTIME</text>
  </g>

  <!-- ==================== LAYER 2: THE ROUTER ==================== -->
  <g transform="translate(320, 110)" filter="url(#drop-shadow)">
    <rect width="200" height="140" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" />
    <rect x="14" y="14" width="28" height="28" rx="6" fill="#0369a1" />
    <text x="20" y="33" font-size="16">⚡</text>
    <text class="card-title" x="50" y="32">ask (AI Router)</text>
    <text class="card-desc" x="14" y="64">• 2-Tier Semantic Triage</text>
    <text class="card-desc" x="14" y="80">• PII &amp; Secret Sanitizer</text>
    <text class="card-desc" x="14" y="96">• Real-time Line Streaming</text>
    <text class="card-desc" x="14" y="112">• /copy &amp; /clear controls</text>
    <rect x="110" y="14" width="76" height="16" rx="4" fill="#0369a1" />
    <text class="badge-text" x="116" y="26" fill="#e0f2fe">HYBRID v1.4.0</text>
  </g>

  <!-- ==================== LAYER 3: SPECIALIZED MODEL MATRIX ==================== -->
  <!-- Model 1: Fast -->
  <g transform="translate(600, 95)" filter="url(#drop-shadow)">
    <rect width="250" height="48" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.2" />
    <text class="card-title" x="12" y="24">Gemini 3.8 Flash</text>
    <text class="card-desc" x="12" y="40">Docs, typos, lint, regex (0 RAM / fast)</text>
    <rect x="180" y="12" width="60" height="16" rx="4" fill="#14532d" />
    <text class="badge-text" x="188" y="24" fill="#4ade80">TIER 1</text>
  </g>

  <!-- Model 2: Standard Engineering (Hydrogen) -->
  <g transform="translate(600, 155)" filter="url(#drop-shadow)">
    <rect width="250" height="48" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.6" />
    <text class="card-title" x="12" y="24">Gemini 4 Hydrogen</text>
    <text class="card-desc" x="12" y="40">Standard Engineering, APIs, features</text>
    <rect x="172" y="12" width="68" height="16" rx="4" fill="#0369a1" />
    <text class="badge-text" x="180" y="24" fill="#38bdf8">EXECUTOR</text>
  </g>

  <!-- Model 3: Architecture & SOLID -->
  <g transform="translate(600, 215)" filter="url(#drop-shadow)">
    <rect width="250" height="48" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" />
    <text class="card-title" x="12" y="24">Claude Sonnet 5.5</text>
    <text class="card-desc" x="12" y="40">SOLID, Clean Code, Calisthenics</text>
    <rect x="174" y="12" width="66" height="16" rx="4" fill="#581c87" />
    <text class="badge-text" x="183" y="24" fill="#c084fc">QUALITY</text>
  </g>

  <!-- Model 4: Big Context / Planner -->
  <g transform="translate(600, 275)" filter="url(#drop-shadow)">
    <rect width="250" height="48" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2" />
    <text class="card-title" x="12" y="24">Gemini 4 Neon</text>
    <text class="card-desc" x="12" y="40">1M+ Token Window, full-repo specs</text>
    <rect x="180" y="12" width="60" height="16" rx="4" fill="#78350f" />
    <text class="badge-text" x="189" y="24" fill="#fbbf24">PLANNER</text>
  </g>

  <!-- Model 5: Deep / Offline -->
  <g transform="translate(600, 335)" filter="url(#drop-shadow)">
    <rect width="250" height="48" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="1.2" />
    <text class="card-title" x="12" y="24">Claude Opus / Codex / Ollama</text>
    <text class="card-desc" x="12" y="40">Deadlocks, formal proofs &amp; 0-token offline</text>
    <rect x="174" y="12" width="66" height="16" rx="4" fill="#334155" />
    <text class="badge-text" x="180" y="24" fill="#cbd5e1">DEEP / OFFLINE</text>
  </g>

  <!-- ==================== LAYER 4: MEMORY & GRAPH ==================== -->
  <!-- Codebase Memory Graph -->
  <g transform="translate(60, 460)" filter="url(#drop-shadow)">
    <rect width="280" height="120" rx="12" fill="#131c2e" stroke="#38bdf8" stroke-width="1.4" />
    <rect x="14" y="14" width="28" height="28" rx="6" fill="#0369a1" />
    <text x="21" y="33" font-size="16">🕸️</text>
    <text class="card-title" x="50" y="32">codebase-memory-mcp</text>
    <text class="card-desc" x="14" y="64">• AST Tree-sitter knowledge graph</text>
    <text class="card-desc" x="14" y="80">• Cypher queries (~500 tokens vs 80k grep)</text>
    <text class="card-desc" x="14" y="96">• Git diff impact analysis (detect_changes)</text>
    <rect x="14" y="102" width="140" height="14" rx="3" fill="#0369a1" />
    <text class="badge-text" x="18" y="113" fill="#e0f2fe">HTTP UI: localhost:9749</text>
  </g>

  <!-- Obsidian Agentic OS -->
  <g transform="translate(380, 460)" filter="url(#drop-shadow)">
    <rect width="280" height="120" rx="12" fill="#131c2e" stroke="#c084fc" stroke-width="1.4" />
    <rect x="14" y="14" width="28" height="28" rx="6" fill="#581c87" />
    <text x="21" y="33" font-size="16">📓</text>
    <text class="card-title" x="50" y="32">Obsidian Agentic OS</text>
    <text class="card-desc" x="14" y="64">• Architecture Decision Records (ADRs)</text>
    <text class="card-desc" x="14" y="80">• Technical Specs &amp; Feature Interviewer</text>
    <text class="card-desc" x="14" y="96">• Session handoffs (zero context loss)</text>
    <rect x="14" y="102" width="124" height="14" rx="3" fill="#581c87" />
    <text class="badge-text" x="18" y="113" fill="#f3e8ff">7-COLOR GRAPH VIEW</text>
  </g>

  <!-- Kiri Linux Sandbox & Tunnels -->
  <g transform="translate(700, 460)" filter="url(#drop-shadow)">
    <rect width="360" height="120" rx="12" fill="#131c2e" stroke="#4ade80" stroke-width="1.4" />
    <rect x="14" y="14" width="28" height="28" rx="6" fill="#14532d" />
    <text x="21" y="33" font-size="16">🐳</text>
    <text class="card-title" x="50" y="32">Kiri Runtime &amp; Sandboxing</text>
    <text class="card-desc" x="14" y="64">• orca-sandbox: Ephemeral Linux containers for agent builds</text>
    <text class="card-desc" x="14" y="80">• orca-share: Instant HTTPS public tunnels for worktree ports</text>
    <text class="card-desc" x="14" y="96">• kiri-monitor: Orca sidebar panel for container health</text>
    <rect x="14" y="102" width="130" height="14" rx="3" fill="#14532d" />
    <text class="badge-text" x="18" y="113" fill="#bbf7d0">LINUX 6.X CONTAINER</text>
  </g>
</svg>
